[package]
name = "packets-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1"
libfuzzer-sys = "0.4"
packet_core = { path = "../packet_core" }
packet_macros = { path = "../packet_macros" }
serde = { version = "1", features = ["derive"] }
serde-value = "0.7"

[[bin]]
name = "unpack_frame"
path = "fuzz_targets/unpack_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_typed"
path = "fuzz_targets/decode_typed.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
