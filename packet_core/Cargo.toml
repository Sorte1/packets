[package]
name = "krunker_packet_core"
description = "Runtime traits and msgpack decode helpers for Krunker WebSocket packets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["krunker", "packet", "msgpack", "serde", "websocket"]
categories = ["encoding", "network-programming", "game-development"]

[lib]
name = "packet_core"

[dependencies]
anyhow = "1"
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde-value = "0.7"
thiserror = "1"
tracing = { version = "0.1", optional = true }

[features]
default = []
tracing = ["dep:tracing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
