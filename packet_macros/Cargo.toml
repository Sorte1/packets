[package]
name = "krunker_packet_macros"
description = "Derive macros for describing Krunker WebSocket packets as Rust structs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["krunker", "packet", "macros", "derive", "msgpack"]
categories = ["development-tools::procedural-macro-helpers", "encoding"]

[lib]
name = "packet_macros"
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

[package.metadata.docs.rs]
all-features = true
